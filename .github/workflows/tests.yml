name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # No secrets are available to this job by design.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: type check
        run: mypy --strict src/llmapp scripts evalsetup.py
      - name: offline tests
        run: pytest -q -m "not local_server and not live"

  local_server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: tests against local endpoints
        run: pytest -q -m "local_server"

  evaluation:
    # Quality-affecting paths only. The gate scores real model output,
    # so it needs a provider key; without one it reports and exits 0
    # rather than failing a pull request that cannot supply secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: quality gate
        env:
          LLMAPP_PROVIDER: ${{ vars.LLMAPP_PROVIDER || 'openai' }}
          LLMAPP_MODEL: ${{ vars.LLMAPP_MODEL }}
          LLMAPP_API_KEY: ${{ secrets.LLMAPP_API_KEY }}
          LLMAPP_DAILY_COST_LIMIT_USD: "2.00"
        run: |
          if [ -z "$LLMAPP_API_KEY" ] || [ -z "$LLMAPP_MODEL" ]; then
            echo "No LLMAPP_API_KEY secret or LLMAPP_MODEL variable"
            echo "configured; evaluation skipped."
            exit 0
          fi
          python scripts/quality_gate.py --record main
          python scripts/quality_gate.py --baseline main
          python scripts/quality_gate.py --adversarial

  build:
    needs: [offline, local_server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -t llmapp:${{ github.sha }} .
      - name: smoke test the container
        env:
          SMOKE_SECRET: not-a-real-secret-just-32-bytes-ok
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e LLMAPP_PROVIDER=fake \
            -e LLMAPP_JWT_SECRET="$SMOKE_SECRET" \
            llmapp:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
      - name: container logs on failure
        if: failure()
        run: docker logs smoke || true

  live:
    # Nightly only, and the only job that can spend money.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: live tests
        env:
          LLMAPP_PROVIDER: ${{ vars.LLMAPP_PROVIDER || 'openai' }}
          LLMAPP_MODEL: ${{ vars.LLMAPP_MODEL }}
          LLMAPP_API_KEY: ${{ secrets.LLMAPP_API_KEY }}
          LLMAPP_DAILY_COST_LIMIT_USD: "2.00"
        run: |
          if [ -z "$LLMAPP_API_KEY" ] || [ -z "$LLMAPP_MODEL" ]; then
            echo "No credentials configured; live tests skipped."
            exit 0
          fi
          pytest -q -m "live"
