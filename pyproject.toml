[project]
name = "llmapp"
version = "1.0.0"
description = "Reference application for LLM Engineering."
requires-python = ">=3.12"
dependencies = [
    "openai==3.8.0",
    "anthropic==1.4.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "tenacity==9.1.4",
    "structlog==26.1.0",
    "python-dotenv==1.2.2",
    "tiktoken==0.14.0",
    "numpy>=2.0",
    "rank-bm25==0.2.2",
    "chromadb==1.5.9",
    "pypdf==5.9.0",
    "pyjwt==2.13.0",
    "opentelemetry-sdk==1.44.0",
    "mcp==2.1.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.5", "pgvector==0.5.0"]
bench = ["faiss-cpu==1.15.0"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.167.1",
    "mypy",
    "fpdf2==2.8.8",
]

[project.scripts]
llmapp-serve = "llmapp.api.run:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." puts the repository root on sys.path so cross-test imports
# (from tests.test_api import ...) and evalsetup resolve under the
# bare `pytest` command, not only under `python -m pytest`.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "local_server: runs against a local mock endpoint",
    "live: calls a real provider and costs money",
]

[tool.mypy]
python_version = "3.12"

# Optional backends: the package type-checks without them, so
# `mypy --strict` is clean on a core install.
[[tool.mypy.overrides]]
module = ["psycopg.*", "pgvector.*", "faiss.*", "chromadb.*"]
ignore_missing_imports = true
